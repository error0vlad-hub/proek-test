<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7ed">
  <title>Дино-побег — игра в браузере</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #183b32;
      background: #f4f7ed;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(199, 225, 164, .34), transparent 55%),
        #f4f7ed;
    }

    .game {
      width: min(920px, calc(100% - 36px));
      padding: 30px 34px 25px;
      border: 1px solid rgba(38, 76, 59, .1);
      border-radius: 28px;
      background: rgba(255, 255, 250, .92);
      box-shadow: 0 24px 70px rgba(48, 74, 48, .12), 0 3px 10px rgba(48, 74, 48, .05);
    }

    .topline, .scores, .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #6c8c69;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 37px);
      letter-spacing: -.055em;
    }

    .badge {
      padding: 9px 13px;
      border: 1px solid #e4eadb;
      border-radius: 999px;
      color: #62785f;
      background: #f8faf3;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .scores {
      justify-content: flex-end;
      gap: 24px;
      margin: 24px 2px 10px;
      color: #779072;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .scores strong {
      display: inline-block;
      min-width: 44px;
      margin-left: 7px;
      color: #234539;
      font-size: 17px;
      letter-spacing: .03em;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .arena {
      position: relative;
      overflow: hidden;
      border: 1px solid #e6ebdf;
      border-radius: 18px;
      background: #f7faef;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 300;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(247, 250, 239, .62);
      text-align: center;
      transition: opacity .18s ease, visibility .18s ease;
    }

    .overlay[hidden] {
      display: grid;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .overlay-content { transform: translateY(-1px); }

    .overlay h2 {
      margin: 0 0 7px;
      font-size: clamp(21px, 4vw, 30px);
      letter-spacing: -.04em;
    }

    .overlay p {
      margin: 0 0 17px;
      color: #71866d;
      font-size: 14px;
    }

    button {
      min-height: 46px;
      padding: 0 23px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: #367b57;
      box-shadow: 0 5px 0 #276243, 0 9px 20px rgba(39, 98, 67, .18);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    button:hover { background: #2f714e; transform: translateY(-1px); }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #276243; }
    button:focus-visible { outline: 3px solid #91c66f; outline-offset: 4px; }

    .bottomline {
      gap: 12px;
      margin-top: 19px;
      color: #81917b;
      font-size: 12px;
    }

    .key {
      display: inline-grid;
      min-width: 25px;
      height: 24px;
      margin: 0 3px;
      padding: 0 6px;
      place-items: center;
      border: 1px solid #dfe6d7;
      border-bottom-width: 2px;
      border-radius: 7px;
      color: #506d53;
      background: #fbfcf8;
      font-size: 11px;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .game { width: calc(100% - 20px); padding: 23px 16px 18px; border-radius: 22px; }
      .badge { padding: 8px 10px; font-size: 10px; }
      .scores { gap: 12px; margin-top: 20px; }
      .scores strong { min-width: 35px; font-size: 15px; }
      .bottomline { font-size: 11px; }
      .bottomline span:last-child { text-align: right; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topline">
      <div>
        <p class="eyebrow">Маленькая большая игра</p>
        <h1>Дино-побег</h1>
      </div>
      <span class="badge">🌿 Осторожно, кактусы!</span>
    </header>

    <div class="scores" aria-live="polite" aria-atomic="true">
      <span>СЧЁТ<strong id="score">00000</strong></span>
      <span>РЕКОРД<strong id="best">00000</strong></span>
    </div>

    <section class="arena" aria-label="Игровое поле">
      <canvas id="gameCanvas" width="900" height="300" aria-label="Динозавр бежит по пустыне. Перепрыгивайте кактусы."></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-content">
          <h2 id="overlayTitle">Готов к приключению?</h2>
          <p id="overlayText">Прыгай через кактусы и ставь рекорды!</p>
          <button id="startButton" type="button">Начать игру</button>
        </div>
      </div>
    </section>

    <footer class="bottomline">
      <span><span class="key">ПРОБЕЛ</span> или <span class="key">↑</span> — прыгать</span>
      <span>На телефоне — просто коснись экрана</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.querySelector("#score");
      const bestElement = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlayTitle");
      const overlayText = document.querySelector("#overlayText");
      const startButton = document.querySelector("#startButton");

      const groundY = 238;
      const dino = { x: 105, y: groundY, vy: 0, width: 42, height: 48, legFrame: 0 };
      const obstacles = [];
      const clouds = [
        { x: 142, y: 63, size: 1 },
        { x: 425, y: 100, size: .72 },
        { x: 700, y: 54, size: .9 }
      ];

      let state = "ready";
      let score = 0;
      let best = readBest();
      let speed = 340;
      let spawnTimer = 1.25;
      let previousTime = 0;
      let animationFrame = 0;

      bestElement.textContent = formatScore(best);
      draw();

      function readBest() {
        try {
          return Number(localStorage.getItem("dinoEscapeBest")) || 0;
        } catch (error) {
          console.warn("Не удалось прочитать рекорд из хранилища браузера.", error);
          return 0;
        }
      }

      function saveBest(value) {
        try {
          localStorage.setItem("dinoEscapeBest", String(value));
        } catch (error) {
          console.warn("Не удалось сохранить рекорд в хранилище браузера.", error);
        }
      }

      function formatScore(value) {
        return String(Math.floor(value)).padStart(5, "0");
      }

      function startGame() {
        cancelAnimationFrame(animationFrame);
        score = 0;
        speed = 340;
        spawnTimer = 1.1;
        dino.y = groundY;
        dino.vy = 0;
        dino.legFrame = 0;
        obstacles.length = 0;
        scoreElement.textContent = formatScore(score);
        state = "playing";
        overlay.hidden = true;
        previousTime = performance.now();
        animationFrame = requestAnimationFrame(update);
      }

      function jump() {
        if (state === "ready" || state === "over") {
          startGame();
          return;
        }
        if (dino.y >= groundY - .5) dino.vy = -650;
      }

      function endGame() {
        state = "over";
        overlayTitle.textContent = "Вот это забег!";
        overlayText.textContent = `Твой счёт — ${formatScore(score)}. Сможешь ещё дальше?`;
        startButton.textContent = "Играть ещё";
        overlay.hidden = false;
      }

      function update(time) {
        const dt = Math.min((time - previousTime) / 1000, .035);
        previousTime = time;
        score += dt * 10;
        speed = Math.min(340 + score * 2.1, 650);
        dino.vy += 1800 * dt;
        dino.y = Math.min(groundY, dino.y + dino.vy * dt);
        if (dino.y >= groundY) dino.vy = 0;
        dino.legFrame += dt * (speed / 35);

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          obstacles.push(makeCactus());
          spawnTimer = 1.15 + Math.random() * .8 + Math.max(0, 340 - speed) / 700;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const cactus = obstacles[i];
          cactus.x -= speed * dt;
          if (cactus.x + cactus.width < 0) obstacles.splice(i, 1);
          if (collides(cactus)) {
            score = Math.floor(score);
            if (score > best) {
              best = score;
              bestElement.textContent = formatScore(best);
              saveBest(best);
            }
            scoreElement.textContent = formatScore(score);
            draw();
            endGame();
            return;
          }
        }

        for (const cloud of clouds) {
          cloud.x -= speed * dt * .12;
          if (cloud.x < -100) cloud.x = 960 + Math.random() * 120;
        }

        scoreElement.textContent = formatScore(score);
        draw();
        animationFrame = requestAnimationFrame(update);
      }

      function makeCactus() {
        const height = 34 + Math.random() * 18;
        const width = 20 + Math.random() * 9;
        return { x: 930, y: groundY + dino.height - height, width, height };
      }

      function collides(cactus) {
        const left = dino.x + 8;
        const right = dino.x + dino.width - 6;
        const top = dino.y + 6;
        const bottom = dino.y + dino.height;
        return right > cactus.x + 3 && left < cactus.x + cactus.width - 2 &&
          bottom > cactus.y + 3 && top < groundY + dino.height;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f7faef";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        clouds.forEach(drawCloud);
        drawHill(0, 225, 180, 32);
        drawHill(260, 232, 220, 22);
        drawHill(620, 226, 210, 29);

        ctx.strokeStyle = "#b9cba9";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY + dino.height);
        ctx.lineTo(canvas.width, groundY + dino.height);
        ctx.stroke();

        ctx.fillStyle = "#a8bf97";
        for (let i = 0; i < 18; i++) {
          const x = (i * 71 + 23) % canvas.width;
          const y = 249 + (i % 3) * 8;
          ctx.fillRect(x, y, 3 + (i % 2), 2);
        }

        obstacles.forEach(drawCactus);
        drawDino();
      }

      function drawCloud(cloud) {
        const x = cloud.x;
        const y = cloud.y;
        const s = cloud.size;
        ctx.fillStyle = "rgba(208, 223, 193, .67)";
        ctx.beginPath();
        ctx.ellipse(x, y, 31 * s, 9 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(x - 14 * s, y - 6 * s, 13 * s, 12 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 1 * s, y - 11 * s, 17 * s, 16 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 17 * s, y - 5 * s, 14 * s, 11 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawHill(x, y, width, height) {
        ctx.fillStyle = "#e9f0df";
        ctx.beginPath();
        ctx.ellipse(x + width / 2, y + height, width / 2, height, 0, Math.PI, Math.PI * 2);
        ctx.fill();
      }

      function drawCactus(cactus) {
        const x = cactus.x;
        const top = cactus.y;
        const bottom = groundY + dino.height;
        ctx.fillStyle = "#4c8c57";
        roundedRect(x + cactus.width * .34, top, cactus.width * .34, bottom - top, 5);
        roundedRect(x, top + cactus.height * .42, cactus.width * .4, 7, 4);
        roundedRect(x, top + cactus.height * .27, 7, cactus.height * .2, 4);
        roundedRect(x + cactus.width * .6, top + cactus.height * .29, cactus.width * .4, 7, 4);
        roundedRect(x + cactus.width - 7, top + cactus.height * .12, 7, cactus.height * .22, 4);
      }

      function drawDino() {
        const x = dino.x;
        const y = dino.y;
        const grounded = y >= groundY - .5;
        const leg = grounded && state === "playing" ? Math.floor(dino.legFrame) % 2 : 0;
        ctx.fillStyle = "#285e44";
        ctx.beginPath();
        ctx.moveTo(x + 7, y + 31);
        ctx.lineTo(x - 4, y + 26);
        ctx.lineTo(x + 7, y + 24);
        ctx.closePath();
        ctx.fill();
        roundedRect(x + 5, y + 18, 23, 24, 7);
        roundedRect(x + 18, y + 4, 21, 20, 6);
        roundedRect(x + 31, y + 11, 17, 10, 4);
        ctx.fillStyle = "#285e44";
        ctx.fillRect(x + 23, y + 2, 5, 5);
        ctx.fillRect(x + 34, y + 2, 5, 5);
        ctx.fillStyle = "#f6faed";
        ctx.fillRect(x + 34, y + 9, 3, 3);
        ctx.fillStyle = "#244436";
        ctx.fillRect(x + 35, y + 10, 2, 2);
        ctx.fillStyle = "#86b56e";
        ctx.fillRect(x + 13, y + 25, 5, 5);
        roundedRect(x + 13, y + 39, 7, leg ? 9 : 7, 3);
        roundedRect(x + 25, y + 39, 7, leg ? 7 : 9, 3);
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, Math.min(radius, width / 2, height / 2));
        ctx.fill();
      }

      startButton.addEventListener("click", startGame);
      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        jump();
      });
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp" || event.code === "KeyW") {
          event.preventDefault();
          jump();
        }
      });
    })();
  </script>
</body>
</html>
